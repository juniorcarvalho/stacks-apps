version: '3.8'

services:
  postgres:
    image: postgres:17.6
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 
      POSTGRES_DB: 
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - network_public
    command:
      - "postgres"
      - "-c"
      - "max_connections=3000"

volumes:
  pg_data:

networks:
  network_public:
    external: true
